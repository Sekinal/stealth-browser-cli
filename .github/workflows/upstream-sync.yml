name: Upstream Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        run: |
          git remote add upstream https://github.com/microsoft/playwright-cli.git
          git fetch upstream main
          git merge --no-commit --no-ff upstream/main

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Run tests
        run: npm ci && npm test

      - name: Create sync PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/upstream-main
          title: "chore: sync upstream playwright-cli"
          commit-message: "chore: sync upstream playwright-cli"
          body: |
            Syncs this fork with `microsoft/playwright-cli@main`.

            This PR is intentionally not auto-merged because this fork patches
            browser-provider startup behavior and depends on upstream CLI internals.
          labels: upstream-sync
